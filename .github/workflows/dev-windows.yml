name: Dev Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  BUILD_TYPE: Release

jobs:
  build-windows-cpu:
    runs-on: windows-latest
    name: Windows CPU Dev Build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download RMVPE Model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Resources/models" | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/mdkrain/HachiTune/releases/download/Resources%2Fmodels/rmvpe.onnx" `
            -OutFile "Resources/models/rmvpe.onnx"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DUSE_ASIO=ON `
            -DUSE_DIRECTML=OFF `
            -DPITCHNET_DEV_BUILD=ON `
            -DENABLE_NOTE_STRETCH=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config ${{ env.BUILD_TYPE }} `
            --parallel

      - name: Prepare Portable Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item -Path package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "package/Standalone" | Out-Null
          New-Item -ItemType Directory -Force -Path "package/VST3" | Out-Null

          # Copy the complete standalone build output, including runtime DLLs.
          $standaloneDir = "build/PitchNet_artefacts/${{ env.BUILD_TYPE }}"
          if (-not (Test-Path $standaloneDir)) {
            throw "Standalone output directory not found: $standaloneDir"
          }

          Copy-Item -Path "$standaloneDir/*" `
            -Destination "package/Standalone/" `
            -Recurse -Force

          # PitchNet expects local portable model assets under Resources/models.
          # Copy the complete Resources tree after CMake has downloaded GAME models.
          Copy-Item -Path "Resources" `
            -Destination "package/Standalone/Resources" `
            -Recurse -Force

          # Copy the complete VST3 bundle if present.
          $vst3Root = "build/PitchNetPlugin_artefacts/${{ env.BUILD_TYPE }}/VST3"
          if (Test-Path $vst3Root) {
            Get-ChildItem -Path $vst3Root -Directory -Filter "*.vst3" |
              ForEach-Object {
                Copy-Item -Path $_.FullName `
                  -Destination "package/VST3/" `
                  -Recurse -Force
              }
          }

          Write-Host "===== Standalone package ====="
          Get-ChildItem "package/Standalone" -Recurse |
            Select-Object FullName

          Write-Host "===== VST3 package ====="
          Get-ChildItem "package/VST3" -Recurse |
            Select-Object FullName

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitchNet-Windows-CPU-Dev-Portable
          path: package/
          retention-days: 30
          if-no-files-found: error
